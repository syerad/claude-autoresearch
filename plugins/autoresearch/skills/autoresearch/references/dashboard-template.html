<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="10">
  <title>Autoresearch Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      color: #1a1a1a;
      background: #fafafa;
      line-height: 1.5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    /* Header */
    .page-header {
      margin-bottom: 24px;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 16px;
    }

    .page-header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .page-header .run-name {
      font-size: 13px;
      color: #6a737d;
      margin-top: 2px;
    }

    /* Status bar */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
      padding: 12px 16px;
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .status-dot.running  { background: #e36209; }
    .status-dot.complete { background: #22863a; }
    .status-dot.error    { background: #cb2431; }

    .status-text.running  { color: #e36209; }
    .status-text.complete { color: #22863a; }
    .status-text.error    { color: #cb2431; }

    .score-summary {
      display: flex;
      gap: 20px;
      margin-left: auto;
      font-size: 13px;
    }

    .score-summary span { color: #6a737d; }
    .score-summary strong { color: #1a1a1a; }

    /* Progress bar */
    .progress-section {
      margin-bottom: 24px;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 13px;
      color: #6a737d;
    }

    .progress-track {
      height: 6px;
      background: #e0e0e0;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #0366d6;
      border-radius: 3px;
      transition: none;
    }

    /* Grid layout */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    @media (max-width: 768px) {
      .grid-2 { grid-template-columns: 1fr; }
    }

    /* Cards */
    .card {
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      overflow: hidden;
    }

    .card-header {
      padding: 12px 16px;
      border-bottom: 1px solid #e0e0e0;
      font-size: 13px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .card-body {
      padding: 16px;
    }

    .chart-wrapper {
      position: relative;
      height: 260px;
    }

    /* Tables */
    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th {
      text-align: left;
      padding: 8px 12px;
      font-weight: 600;
      color: #6a737d;
      border-bottom: 1px solid #e0e0e0;
      white-space: nowrap;
    }

    td {
      padding: 8px 12px;
      border-bottom: 1px solid #f0f0f0;
      color: #1a1a1a;
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }

    tr:hover td { background: #f9f9f9; }

    /* Status badges */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0;
      border: 1px solid transparent;
    }

    .badge-baseline   { color: #0366d6; background: #f1f8ff; border-color: #c8e1ff; }
    .badge-keep       { color: #22863a; background: #f0fff4; border-color: #bef5cb; }
    .badge-discard    { color: #cb2431; background: #fff5f5; border-color: #ffd1d1; }
    .badge-guard_fail { color: #e36209; background: #fff8f0; border-color: #ffd1a0; }
    .badge-timeout    { color: #e36209; background: #fff8f0; border-color: #ffd1a0; }
    .badge-running    { color: #6a737d; background: #f6f8fa; border-color: #e0e0e0; }

    /* Eval breakdown */
    .eval-table td.pass-rate {
      font-weight: 500;
    }

    .pass-bar-cell {
      width: 120px;
    }

    .mini-bar-track {
      height: 4px;
      background: #e0e0e0;
      border-radius: 2px;
      overflow: hidden;
      margin-top: 2px;
    }

    .mini-bar-fill {
      height: 100%;
      border-radius: 2px;
    }

    .mini-bar-fill.good   { background: #22863a; }
    .mini-bar-fill.medium { background: #e36209; }
    .mini-bar-fill.bad    { background: #cb2431; }

    /* Description text */
    .desc { color: #444; max-width: 340px; }

    /* No-chart fallback */
    .no-chart-notice {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #6a737d;
      font-size: 13px;
    }
  </style>
</head>
<body>

<script>const DATA = __DATA_PLACEHOLDER__;</script>

<div class="container">

  <!-- Header -->
  <div class="page-header">
    <h1>Autoresearch Run</h1>
    <div class="run-name" id="run-name"></div>
  </div>

  <!-- Status bar -->
  <div class="status-bar">
    <div class="status-indicator">
      <div class="status-dot" id="status-dot"></div>
      <span class="status-text" id="status-text"></span>
    </div>
    <div id="experiment-label" style="font-size:13px;color:#6a737d;"></div>
    <div class="score-summary">
      <div><span>Baseline: </span><strong id="baseline-score">—</strong></div>
      <div><span>Best: </span><strong id="best-score">—</strong></div>
    </div>
  </div>

  <!-- Progress bar -->
  <div class="progress-section">
    <div class="progress-label">
      <span id="progress-label-text">Progress</span>
      <span id="progress-pct"></span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>

  <!-- Chart + Eval breakdown side by side -->
  <div class="grid-2">
    <div class="card">
      <div class="card-header">Score Progression</div>
      <div class="card-body">
        <div class="chart-wrapper">
          <canvas id="score-chart"></canvas>
          <div class="no-chart-notice" id="chart-fallback" style="display:none;">
            Chart.js unavailable — see table below.
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">Eval Breakdown</div>
      <div class="table-wrapper">
        <table id="eval-table">
          <thead>
            <tr>
              <th>Eval</th>
              <th>Passed</th>
              <th>Total</th>
              <th>Rate</th>
              <th class="pass-bar-cell"></th>
            </tr>
          </thead>
          <tbody id="eval-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Experiment table -->
  <div class="card">
    <div class="card-header">Experiments</div>
    <div class="table-wrapper">
      <table id="experiments-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Score</th>
            <th>Pass Rate</th>
            <th>Status</th>
            <th>Description</th>
          </tr>
        </thead>
        <tbody id="experiments-tbody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
(function () {
  var data = DATA;

  // --- Status bar ---
  var statusDot  = document.getElementById('status-dot');
  var statusText = document.getElementById('status-text');
  var expLabel   = document.getElementById('experiment-label');

  var statusClass = data.status === 'complete' ? 'complete'
                  : data.status === 'error'    ? 'error'
                  : 'running';

  statusDot.className  = 'status-dot ' + statusClass;
  statusText.className = 'status-text ' + statusClass;

  if (data.status === 'running') {
    statusText.textContent = 'Running experiment ' + data.current_experiment + '…';
    expLabel.textContent   = 'Experiment ' + data.current_experiment + ' of ' + data.max_iterations;
  } else if (data.status === 'complete') {
    statusText.textContent = 'Complete';
    expLabel.textContent   = data.current_experiment + ' experiments run';
  } else {
    statusText.textContent = data.status || 'Unknown';
  }

  document.getElementById('run-name').textContent = data.name || '';

  var baselineScore = typeof data.baseline_score === 'number' ? data.baseline_score.toFixed(1) + '%' : '—';
  var bestScore     = typeof data.best_score     === 'number' ? data.best_score.toFixed(1)     + '%' : '—';
  document.getElementById('baseline-score').textContent = baselineScore;
  document.getElementById('best-score').textContent     = bestScore;

  // --- Progress bar ---
  var maxIter = data.max_iterations || 1;
  var curExp  = data.current_experiment || 0;
  var pct     = Math.min(100, Math.round((curExp / maxIter) * 100));
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-pct').textContent  = pct + '%';
  document.getElementById('progress-label-text').textContent =
    'Experiment ' + curExp + ' of ' + maxIter;

  // --- Experiment table ---
  var experiments = Array.isArray(data.experiments) ? data.experiments : [];
  var expTbody = document.getElementById('experiments-tbody');

  experiments.forEach(function (exp) {
    var tr = document.createElement('tr');

    var scoreText    = (exp.score != null && exp.max_score != null)
                       ? exp.score + ' / ' + exp.max_score
                       : exp.score != null ? exp.score : '—';
    var passRateText = exp.pass_rate != null ? exp.pass_rate.toFixed(1) + '%' : '—';
    var statusKey    = (exp.status || 'running').toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');
    var badgeClass   = 'badge badge-' + statusKey;
    var desc         = exp.description || '';

    tr.innerHTML =
      '<td>' + escapeHtml(exp.id) + '</td>' +
      '<td>' + scoreText + '</td>' +
      '<td>' + passRateText + '</td>' +
      '<td><span class="' + badgeClass + '">' + escapeHtml(exp.status || '') + '</span></td>' +
      '<td class="desc">' + escapeHtml(desc) + '</td>';

    expTbody.appendChild(tr);
  });

  // --- Eval breakdown table ---
  var evalBreakdown = Array.isArray(data.eval_breakdown) ? data.eval_breakdown : [];
  var evalTbody = document.getElementById('eval-tbody');

  evalBreakdown.forEach(function (ev) {
    var tr = document.createElement('tr');
    var total     = ev.total     || 0;
    var passCount = ev.pass_count != null ? ev.pass_count : 0;
    var rate      = total > 0 ? (passCount / total) * 100 : 0;
    var rateText  = rate.toFixed(0) + '%';
    var fillClass = rate >= 80 ? 'good' : rate >= 50 ? 'medium' : 'bad';

    tr.innerHTML =
      '<td>' + escapeHtml(ev.name || '') + '</td>' +
      '<td>' + passCount + '</td>' +
      '<td>' + total + '</td>' +
      '<td class="pass-rate">' + rateText + '</td>' +
      '<td class="pass-bar-cell">' +
        '<div class="mini-bar-track">' +
          '<div class="mini-bar-fill ' + fillClass + '" style="width:' + rate.toFixed(1) + '%"></div>' +
        '</div>' +
      '</td>';

    evalTbody.appendChild(tr);
  });

  // --- Chart.js line chart ---
  var STATUS_COLORS = {
    baseline:   '#0366d6',
    keep:       '#22863a',
    discard:    '#cb2431',
    guard_fail: '#e36209',
    timeout:    '#e36209'
  };

  function pointColor(status) {
    var key = (status || '').toLowerCase().replace(/\s+/g, '_');
    return STATUS_COLORS[key] || '#6a737d';
  }

  if (typeof Chart !== 'undefined' && experiments.length > 0) {
    var labels      = experiments.map(function (e) { return 'Exp ' + e.id; });
    var passRates   = experiments.map(function (e) { return e.pass_rate != null ? e.pass_rate : null; });
    var pointColors = experiments.map(function (e) { return pointColor(e.status); });

    var ctx = document.getElementById('score-chart').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Pass Rate %',
          data: passRates,
          borderColor: '#0366d6',
          borderWidth: 2,
          pointBackgroundColor: pointColors,
          pointBorderColor: pointColors,
          pointRadius: 5,
          pointHoverRadius: 6,
          fill: false,
          tension: 0.2,
          spanGaps: true
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function (ctx) {
                var exp = experiments[ctx.dataIndex];
                var lines = [];
                if (ctx.parsed.y != null) {
                  lines.push('Pass rate: ' + ctx.parsed.y.toFixed(1) + '%');
                }
                if (exp) {
                  lines.push('Status: ' + (exp.status || '—'));
                  if (exp.description) lines.push(exp.description);
                }
                return lines;
              }
            }
          }
        },
        scales: {
          x: {
            grid: { color: '#f0f0f0' },
            ticks: { color: '#6a737d', font: { size: 12 } }
          },
          y: {
            min: 0,
            max: 100,
            grid: { color: '#f0f0f0' },
            ticks: {
              color: '#6a737d',
              font: { size: 12 },
              callback: function (v) { return v + '%'; }
            }
          }
        }
      }
    });
  } else {
    document.getElementById('score-chart').style.display = 'none';
    document.getElementById('chart-fallback').style.display = 'flex';
  }

  // --- Utility ---
  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
})();
</script>

</body>
</html>
